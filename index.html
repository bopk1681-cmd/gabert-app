<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>GABERT BANK v2.0</title>
    <style>
        body { background: #0a0a0a; color: #00ff41; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { border: 1px solid #00ff41; padding: 30px; width: 350px; background: #000; box-shadow: 0 0 20px rgba(0, 255, 65, 0.2); border-radius: 10px; }
        h2 { text-shadow: 0 0 10px #00ff41; letter-spacing: 2px; }
        input { width: 90%; margin: 10px 0; background: #111; color: #00ff41; border: 1px dashed #00ff41; padding: 10px; outline: none; }
        button { width: 100%; margin: 15px 0; background: #00ff41; color: #000; border: none; padding: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        button:hover { background: #fff; box-shadow: 0 0 15px #fff; }
        #bankUI { display: none; }
        .bal-card { font-size: 24px; margin: 20px 0; border: 1px solid #333; padding: 10px; background: #050505; }
    </style>
</head>
<body>

<div class="box">
    <h2>GABERT_CORE</h2>
    <div id="authUI">
        <input type="text" id="phone" placeholder="LOGIN (ID)">
        <input type="password" id="pass" placeholder="PASSWORD">
        <button onclick="auth()">INITIALIZE</button>
    </div>

    <div id="bankUI">
        <div class="bal-card">BALANCE: <span id="balDisplay">0</span> GBT</div>
        <hr style="border: 0.5px solid #00ff41;">
        <p>NEW TRANSFER</p>
        <input type="text" id="to" placeholder="RECIPIENT ID">
        <input type="number" id="sum" placeholder="AMOUNT">
        <input type="text" id="msg" placeholder="MESSAGE (OPTIONAL)">
        <button onclick="send()" style="background: #0088ff; color: white;">EXECUTE TRANSFER</button>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCovx1fzoU_kOYPmqvuCHjARFKChKzJpsQ",
        databaseURL: "https://gaber-600c9-default-rtdb.firebaseio.com",
        projectId: "gaber-600c9",
        appId: "1:317265673087:web:88fd9d789912f5378cb84a"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let userPhone = ""; let userBalance = 0;

    function auth() {
        const p = document.getElementById('phone').value;
        const s = document.getElementById('pass').value;
        if (!p || !s) return;
        userPhone = p;
        db.ref('users/' + p).once('value', snap => {
            if (!snap.exists()) db.ref('users/' + p).set({pass: s, balance: 0});
            else if (snap.val().pass !== s) return alert("ACCESS DENIED");
            showBank();
        });
    }

    function showBank() {
        document.getElementById('authUI').style.display = 'none';
        document.getElementById('bankUI').style.display = 'block';
        db.ref('users/' + userPhone + '/balance').on('value', s => {
            userBalance = s.val() || 0;
            document.getElementById('balDisplay').innerText = userBalance;
        });
    }

    function send() {
        const target = document.getElementById('to').value;
        const amount = parseInt(document.getElementById('sum').value);
        const message = document.getElementById('msg').value || "No message";

        if (userBalance < amount || amount < 1) return alert("INSUFFICIENT FUNDS");
        
        db.ref('users/' + target).once('value', s => {
            if (s.exists()) {
                // Списываем у отправителя
                db.ref('users/' + userPhone + '/balance').set(userBalance - amount);
                // Добавляем получателю
                db.ref('users/' + target + '/balance').set((s.val().balance || 0) + amount);
                
                // ЗАПИСЫВАЕМ ИСТОРИЮ ДЛЯ АДМИНА
                db.ref('transfers').push({
                    from: userPhone,
                    to: target,
                    amount: amount,
                    comment: message,
                    time: new Date().toLocaleString()
                });

                alert("TRANSFER COMPLETE");
                document.getElementById('sum').value = "";
                document.getElementById('msg').value = "";
            } else alert("USER NOT FOUND");
        });
    }
</script>
</body>
</html>
